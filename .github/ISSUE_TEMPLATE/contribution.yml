name: Contribution
description: Offer help - translations, testing, documentation, ideas, or feedback
title: "[Contribution] "
labels: ["contribution", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for wanting to contribute to Ava!
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched the existing issues and found no duplicate
          required: true
  - type: dropdown
    id: contribution_type
    attributes:
      label: What kind of contribution?
      options:
        - Translation / localization
        - Testing on a specific device
        - Documentation / Wiki improvement
        - Feature idea / design proposal
        - Bug reproduction help
        - Other
      default: 5
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what you want to contribute and how it helps Ava.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language (if translation)
      description: Only fill in if your contribution is a translation.
  - type: textarea
    id: device
    attributes:
      label: Device (if testing)
      description: Only fill in if you are offering to test on a specific device. Include Android version.
      placeholder: "Device model, Android version"
  - type: textarea
    id: contact
    attributes:
      label: Contact
      description: How should we reach you? GitHub is fine, or leave an email.
