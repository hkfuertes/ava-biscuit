name: Feature Request
description: Suggest a new feature or an improvement to Ava
title: "[Feature] "
labels: ["feature", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for Ava.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched the existing issues and found no duplicate
          required: true
        - label: This is a feature request, not a bug report
          required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What problem does this feature solve? What are you trying to do that Ava currently cannot do, or does poorly?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like Ava to do.
    validations:
      required: true
  - type: dropdown
    id: feature_area
    attributes:
      label: Feature area
      options:
        - Voice Satellite (wake word, TTS, mic, voiceprint)
        - Bluetooth Proxy / BLE / Presence Detection
        - Voice Messages & Calls
        - Floating Windows (Dream Clock, Simple Clock, Vinyl, Subtitles, Weather Overlay)
        - Notification Scenes
        - Screensaver
        - Browser Display (WebView / GeckoView)
        - Music / Sendspin / Music Assistant
        - Quick Entity Panel
        - Camera / Video / Face Detection
        - Screen Control (brightness, orientation, keep on)
        - Sensors (environment, battery, proximity, diagnostic)
        - Intent Launcher
        - Mod Store / Mods
        - Sidebar / Launcher
        - Settings / UI / Dark Mode
        - Permissions (Shizuku / Root / Device Admin)
        - Auto Update
        - New device support
        - Other
      default: 19
    validations:
      required: true
  - type: dropdown
    id: target_android
    attributes:
      label: Target Android versions
      description: Ava supports Android 5-16.
      multiple: true
      options:
        - "Android 5 - 6"
        - "Android 7 - 9"
        - "Android 10 - 12"
        - "Android 13 - 16"
        - "All supported versions"
    validations:
      required: true
  - type: textarea
    id: mockup
    attributes:
      label: Mockup / reference
      description: Link or attach any mockup, screenshot, or reference.
  - type: textarea
    id: context
    attributes:
      label: Additional context
